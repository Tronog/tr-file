@if (paneId() !== null) {
  <ui-sash
    class="pane-sash"
    orientation="horizontal"
    [label]="'Resize ' + title()"
    (resize)="onSashResize($event)"
  />
}

<div
  class="pane-header"
  [attr.draggable]="paneId() === null ? null : 'true'"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd()"
>
  <button
    #toggleButton
    type="button"
    class="pane-toggle"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="expanded() ? bodyId : null"
    [attr.aria-keyshortcuts]="paneId() === null ? null : 'Control+ArrowUp Control+ArrowDown'"
    (click)="toggle.emit()"
    (keydown)="onHeaderKeyDown($event)"
  >
    <ui-icon class="twisty" [name]="expanded() ? 'chevron-down' : 'chevron-right'" />
    <span class="pane-title">{{ title() }}</span>
  </button>

  @if (actions().length) {
    <span class="pane-actions">
      @for (action of actions(); track action.id) {
        <button
          type="button"
          class="icon-btn"
          [class.is-active]="action.active"
          [disabled]="action.disabled ?? false"
          [attr.title]="action.label"
          [attr.aria-label]="action.label"
          (click)="select(action.id, $event)"
        >
          <ui-icon [name]="action.icon" />
        </button>
      }
    </span>
  }
</div>

@if (expanded()) {
  <div class="pane-body" [id]="bodyId">
    <ng-content />
  </div>
}
