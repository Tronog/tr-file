<nav class="menu">
  <ui-icon class="menu-logo" [name]="brandIcon()" />

  @for (item of menuItems(); track item.id) {
    <button
      type="button"
      class="menu-item"
      [class.is-open]="item.open"
      [attr.aria-expanded]="item.open ?? false"
      (click)="menuSelect.emit(item.id)"
    >
      {{ item.label }}
    </button>
  }
</nav>

@if (commandLabel()) {
  <button type="button" class="command-center" (click)="commandSelect.emit()">
    <ui-icon name="search" />
    <span class="command-label">{{ commandLabel() }}</span>
    @for (key of commandKeys(); track key) {
      <kbd>{{ key }}</kbd>
    }
  </button>
} @else {
  <span class="command-placeholder"></span>
}

<div class="titlebar-right">
  @for (action of actions(); track action.id) {
    <button
      type="button"
      class="chrome-btn"
      [class.is-active]="action.active"
      [disabled]="action.disabled ?? false"
      [attr.title]="action.label"
      [attr.aria-label]="action.label"
      (click)="actionSelect.emit(action.id)"
    >
      <ui-icon [name]="action.icon" />
    </button>
  }

  @if (windowControls().length) {
    <!-- Its own group, flush to the corner: these buttons belong to the
         window, not to the application, and VS Code sets them apart the same
         way. The group is a toolbar so a screen reader announces it as one. -->
    <div class="window-controls" role="toolbar" aria-label="Window">
      @for (control of windowControls(); track control.id) {
        <button
          type="button"
          class="window-btn"
          [class.is-danger]="control.danger"
          [attr.title]="control.label"
          [attr.aria-label]="control.label"
          (click)="windowControlSelect.emit(control.id)"
        >
          <ui-icon [name]="control.icon" />
        </button>
      }
    </div>
  }
</div>
