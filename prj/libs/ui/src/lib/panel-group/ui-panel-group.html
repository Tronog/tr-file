<ui-tab-bar
  [tabs]="group().tabs"
  [groupId]="group().id"
  [actions]="group().actions"
  [groupActive]="active()"
  (select)="tabSelect.emit($event)"
  (activate)="tabActivate.emit($event)"
  (tabDoubleClick)="tabDoubleClick.emit($event)"
  (close)="tabClose.emit($event)"
  (actionSelect)="actionSelect.emit($event)"
  (tabDrop)="tabDrop.emit($event)"
  (tabMove)="tabMove.emit($event)"
/>

<div class="loading-rail">
  @if (group().loading) {
    <ui-progress [value]="null" [label]="loadingLabel()" />
  }
</div>

<div
  #body
  class="group-body"
  tabindex="-1"
  (pointerdown)="onBodyPointerDown($event)"
  (dragover)="onBodyDragOver($event)"
  (dragleave)="onBodyDragLeave($event)"
  (drop)="onBodyDrop($event)"
>
  @if (group().empty; as empty) {
    <div class="group-empty">
      <ui-empty-state [state]="empty" />
    </div>
  }

  <!-- What the active tab shows: the application projects it. -->
  <ng-content />

  @if (dropZone(); as zone) {
    <div class="dropzone dropzone--{{ zone }}" aria-hidden="true"></div>
  }

  @if (fileDragging()) {
    <div class="filedrop" aria-hidden="true">
      <span class="filedrop-label">
        <ui-icon name="upload" />
        Drop files to upload
      </span>
    </div>
  }
</div>
