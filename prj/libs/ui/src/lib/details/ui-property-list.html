<dl class="props">
  @for (property of properties(); track $index) {
    <div class="prop">
      <dt>{{ property.label }}</dt>
      <dd
        [class.is-mono]="property.mono"
        [class.tone-modified]="property.tone === 'modified'"
        [class.tone-untracked]="property.tone === 'untracked'"
        [class.tone-conflict]="property.tone === 'conflict'"
      >
        @if (property.action; as id) {
          <button
            type="button"
            class="prop-action"
            [attr.title]="property.actionLabel ?? null"
            [attr.aria-label]="property.actionLabel ? property.value + ' — ' + property.actionLabel : null"
            (click)="action.emit(id)"
          >
            {{ property.value }}
          </button>
        } @else {
          {{ property.value }}
        }
      </dd>
    </div>
  }
</dl>
