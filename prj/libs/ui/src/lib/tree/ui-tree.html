<div class="tree" role="tree" [attr.aria-label]="label()" (keydown)="onKeyDown($event)">
  @for (node of nodes(); track node.id) {
    <button
      #rowButton
      type="button"
      role="treeitem"
      class="tree-row"
      [class.is-selected]="node.selected"
      [class.is-focused]="node.focused"
      [class.is-cut]="node.cut"
      [class.deco-modified]="node.decoration === 'modified'"
      [class.deco-untracked]="node.decoration === 'untracked'"
      [class.deco-ignored]="node.decoration === 'ignored'"
      [class.deco-conflict]="node.decoration === 'conflict'"
      [attr.aria-level]="node.depth + 1"
      [attr.aria-selected]="node.selected ?? false"
      [attr.aria-expanded]="node.expandable ? (node.expanded ?? false) : null"
      [attr.aria-busy]="node.busy ? 'true' : null"
      [attr.tabindex]="node.id === tabStopId() ? 0 : -1"
      (click)="activate.emit(node.id)"
      (dblclick)="open.emit(node.id)"
      (contextmenu)="onRowContextMenu($event, node)"
    >
      <span class="indent" aria-hidden="true">
        @for (guide of node.guides; track $index) {
          <i [class.on]="guide"></i>
        }
      </span>

      <span
        class="twisty"
        [class.is-hidden]="!node.expandable && !node.busy"
        aria-hidden="true"
        (click)="onTwisty($event, node)"
      >
        @if (node.busy) {
          <i class="spinner"></i>
        } @else {
          <ui-icon [name]="node.expanded ? 'chevron-down' : 'chevron-right'" />
        }
      </span>

      <ui-icon class="file-icon" [name]="node.icon" [tint]="node.tint" />

      <span class="file-name">{{ node.label }}</span>

      @if (node.meta) {
        <span class="file-meta">{{ node.meta }}</span>
      }
    </button>
  }
</div>
