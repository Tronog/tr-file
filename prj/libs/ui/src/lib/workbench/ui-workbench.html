<ui-icon-sprite />

<div class="titlebar-slot" role="banner">
  <ng-content select="[uiSlot=title]" />
</div>

<div class="body">
  <div class="activity-slot" role="navigation" aria-label="Activity bar" [class.is-hidden]="!activityVisible()" [style.order]="activityOrder()">
    <ng-content select="[uiSlot=activity]" />
  </div>

  <div
    class="sidebar"
    [class.at-left]="leftAt() === 'left'"
    [class.at-right]="leftAt() === 'right'"
    [class.is-hidden]="!leftVisible()"
    [style.width.px]="leftWidth()"
    [style.order]="leftOrder()"
  >
    <ng-content select="[uiSlot=left]" />
    <!-- Each sash sits on the edge of its sidebar that faces the centre, so
         two sidebars on one side each keep theirs. -->
    <ui-sash
      class="edge-sash"
      orientation="vertical"
      [label]="leftSashLabel()"
      [value]="leftWidth()"
      [min]="leftMin()"
      [max]="leftMax()"
      (resize)="resized('left', $event)"
    />
  </div>

  <div class="center" role="main" [style.order]="5">
    <ng-content select="[uiSlot=center]" />
  </div>

  <div
    class="sidebar"
    [class.at-left]="rightAt() === 'left'"
    [class.at-right]="rightAt() === 'right'"
    [class.is-hidden]="!rightVisible()"
    [style.width.px]="rightWidth()"
    [style.order]="rightOrder()"
  >
    <ng-content select="[uiSlot=right]" />
    <ui-sash
      class="edge-sash"
      orientation="vertical"
      [label]="rightSashLabel()"
      [value]="rightWidth()"
      [min]="rightMin()"
      [max]="rightMax()"
      (resize)="resized('right', $event)"
    />
  </div>
</div>

<div class="statusbar-slot" role="contentinfo">
  <ng-content select="[uiSlot=status]" />
</div>
