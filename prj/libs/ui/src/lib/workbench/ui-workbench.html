<ui-icon-sprite />

<div class="titlebar-slot" role="banner">
  <ng-content select="[uiSlot=title]" />
</div>

<div class="body">
  <div class="activity-slot" role="navigation" aria-label="Activity bar">
    <ng-content select="[uiSlot=activity]" />
  </div>

  <div class="sidebar sidebar-left" [class.is-hidden]="!leftVisible()" [style.width.px]="leftWidth()">
    <ng-content select="[uiSlot=left]" />
  </div>

  <div class="center" role="main">
    <!-- Both sashes overlay the edges of the main region instead of sitting
         between regions: they resize a boundary either way, and inside a
         landmark they stay reachable to assistive tech. -->
    <ui-sash
      class="edge-sash edge-sash-left"
      orientation="vertical"
      [label]="leftSashLabel()"
      [class.is-hidden]="!leftVisible()"
      [value]="leftWidth()"
      [min]="leftMin()"
      [max]="leftMax()"
      (resize)="resized('left', $event)"
    />

    <ng-content select="[uiSlot=center]" />

    <ui-sash
      class="edge-sash edge-sash-right"
      orientation="vertical"
      [label]="rightSashLabel()"
      [class.is-hidden]="!rightVisible()"
      [value]="rightWidth()"
      [min]="rightMin()"
      [max]="rightMax()"
      (resize)="resized('right', $event)"
    />
  </div>

  <div class="sidebar sidebar-right" [class.is-hidden]="!rightVisible()" [style.width.px]="rightWidth()">
    <ng-content select="[uiSlot=right]" />
  </div>
</div>

<div class="statusbar-slot" role="contentinfo">
  <ng-content select="[uiSlot=status]" />
</div>
