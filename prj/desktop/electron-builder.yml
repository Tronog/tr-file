# Distributables for PRD 001, §8.3: one executable per platform, nothing to
# install and nothing to unpack beside it — and, since §8.4, a Windows setup
# too: one file that installs the app, or updates the copy already installed.
#
# There is no node_modules in here. scripts/bundle.mjs compiles the backend,
# Express and Busboy into dist/main.cjs, so the only thing the packager has to
# place is that file, the preload, and the Angular build — which is why `files`
# is an allowlist rather than a list of exclusions.
appId: com.tronog.tr-file
productName: tr-file
copyright: Copyright © 2026 Ivan Maglica

directories:
  output: release
  buildResources: build

# No native modules, therefore nothing to rebuild against Electron's headers —
# and no reason to let the packager walk the pnpm store looking for some.
npmRebuild: false

files:
  - dist/main.cjs
  - dist/preload.cjs
  - package.json

# The window loads the bundle over the loopback server (§8), so the Angular
# build has to be on disk as ordinary files: `app/browser` under the resources
# directory is exactly where DesktopConfig's PACKAGED_STATIC looks first.
extraResources:
  - from: ../frontend/dist/frontend/browser
    to: app/browser
    filter:
      - '**/*'
  # The icon the main process installs for its desktop entry on Linux (§8.5).
  - from: build/icon.png
    to: icon.png

asar: true

linux:
  # The package name (`@tr-file/desktop`) cannot be a file name, and this is
  # also the WM_CLASS the window reports, so it has to match the .desktop entry
  # or the taskbar shows an unnamed window.
  executableName: tr-file
  syncDesktopName: true
  # AppImage: one file, marked executable, runs on any desktop distro. A .deb
  # would be an installer, which §8.3 explicitly does not ask for.
  target:
    - AppImage
  category: Utility
  synopsis: File workbench
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  # `portable` is the single-exe target of §8.3: the app unpacks itself to a
  # temporary directory and runs. `nsis` is the setup of §8.4, which installs
  # it. Both come from one `pnpm package:win`.
  target:
    - portable
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

portable:
  # No `unpackDirName`: the launcher unpacks into a folder of its own each run
  # (it unpacks afresh every time anyway) and removes it as it exits. With a
  # fixed folder, the launcher of an upgrade (PRD 001, §8.6) would unpack into
  # the very folder the old launcher is deleting.
  requestExecutionLevel: user

# The setup's uninstaller is normally written by running a stub under Wine.
# The package scripts point ELECTRON_BUILDER_WINE_TOOLSET_DIR at
# scripts/nsis-toolset instead, which reads it out of the stub without Wine —
# see the README there.

nsis:
  # §8.4: a single-file setup that installs the app — or, run where it is
  # installed already, updates that copy in place. What makes it the *same*
  # installation is this GUID: the setup finds the previous version under it in
  # the registry, runs that version's uninstaller silently (which leaves the
  # user's settings alone: `deleteAppDataOnUninstall` is false) and installs
  # over it, shortcuts and all. electron-builder derives the GUID from `appId`;
  # it is pinned here — to exactly what it derives for `com.tronog.tr-file` —
  # so that renaming the appId can never turn an update into a second install.
  guid: 853819c6-793f-5011-846c-3b8cd99508d0
  # One click, no wizard: the setup is the single file, and running it is
  # the whole of installing — or updating.
  oneClick: true
  # For the user, into %LOCALAPPDATA%\Programs\tr-file: no administrator, no
  # UAC prompt, and an update needs none either.
  perMachine: false
  allowElevation: false
  # A copy still running is asked to close before its files are replaced;
  # the app holds a single-instance lock, so there is only ever one.
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: tr-file
  deleteAppDataOnUninstall: false
  # Its own name, so it cannot be mistaken for — or overwrite — the portable
  # executable beside it in release/.
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

