# Production environment — only nginx is published, the backend stays internal.
#   pnpm docker:prod        (up --build -d)
#   pnpm docker:prod:down   (down -v)
name: tr-file-prod

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4310
      FILES_ROOT: /data
      # Signing in is required (PRD 003, §2); the backend will not start
      # without an account. Prefer a hash: `pnpm --filter backend hash-password`.
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME to the account allowed to sign in}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      # Git (PRD 011, §1) runs a repository's own hooks and config: off unless asked for,
      # and it needs a `git` binary in the image as well.
      GIT_ENABLED: ${GIT_ENABLED:-false}
    expose:
      - "4310"
    volumes:
      - files_data:/data
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  files_data:
