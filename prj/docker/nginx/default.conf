server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets of the Angular bundle
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for fingerprinted build output
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, it references the fingerprints
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API reverse proxy to the internal backend service
    location /api/ {
        proxy_pass http://backend:4311;
        proxy_http_version 1.1;
        # `$http_host`, not `$host`: it keeps the port, and the backend's CSRF
        # check compares it with the browser's `Origin` (PRD 003, §2).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    client_max_body_size 512m;
}
